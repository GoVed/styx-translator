services:
  styx-translator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: styx-translator-connector
    restart: unless-stopped
    ports:
      - "8772:8772"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - TRANSLATION_MODEL=${TRANSLATION_MODEL:-sarvam-1}
      - HTTP_PORT=8772
      - HTTP_HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - STYX_API_URL=http://host.docker.internal:3000
      - STYX_ACCESS_KEY=${STYX_ACCESS_KEY:-styx-local-dev-key}
    volumes:
      - ./instructions.md:/app/instructions.md:ro
      - ./manifest.json:/app/manifest.json:ro
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8772/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
